[pytest]
# Pytest 설정 파일

# 테스트 검색 경로
testpaths = tests

# 테스트 파일 패턴
python_files = test_*.py

# 테스트 클래스 패턴
python_classes = Test*

# 테스트 함수 패턴
python_functions = test_*

# 출력 옵션
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# 마커 정의
markers =
    unit: 단위 테스트
    integration: 통합 테스트
    slow: 느린 테스트
    api: API 호출 테스트

# 최소 Python 버전
minversion = 3.8
