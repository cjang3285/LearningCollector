# Collector 설정 파일
# Phase 6: 설정 기반 Collector 관리 (SOLID - OCP)
#
# 새로운 Collector 추가 방법:
# 1. 이 파일에 collector 정의 추가
# 2. enabled: true/false로 활성화 제어
# 3. 코드 수정 불필요!

collectors:
  # GitHub 커밋 수집
  github:
    enabled: false                                          # 환경변수 COLLECT_GITHUB로 제어
    config_key: COLLECT_GITHUB                              # .env 설정 키
    description: "GitHub 커밋 수집"
    class_path: "collectors.github_collector.GitHubCollector"
    dependencies:
      loader: "load.github_load.GitHubLoader"
      parser: "parse.github_parse.GitHubParser"
      saver: "storage.github_saver.GitHubSaver"
    priority: 10                                            # 실행 우선순위 (낮을수록 먼저)

  # 백준 문제 풀이 수집
  baekjoon:
    enabled: false                                          # 환경변수 COLLECT_BAEKJOON로 제어
    config_key: COLLECT_BAEKJOON                            # .env 설정 키
    description: "백준 문제 풀이 수집"
    class_path: "collectors.baekjoon_collector.BaekjoonCollector"
    dependencies:
      loader: "load.baekjoon_load.BaekjoonLoader"
      parser: "parse.baekjoon_parse.BaekjoonParser"
      saver: "storage.baekjoon_saver.BaekjoonSaver"
    priority: 20

  # AI 채팅 마크다운 수집 (Claude, ChatGPT, Gemini)
  ai_chat:
    enabled: true                                           # 항상 활성화
    config_key: null                                        # 환경변수 제어 없음
    description: "AI 채팅 마크다운 수집 (Claude, ChatGPT, Gemini)"
    class_path: "collectors.ai_chat_collector.AIChatCollector"
    dependencies:
      parser: "parse.ai_chat_parse.AIMarkdownParser"
      saver: "storage.ai_chat_saver.AIChatSaver"
    priority: 30

  # Claude ZIP 마이그레이션 (첫 이용 시)
  claude_migration:
    enabled: false                                          # 수동 실행만 (CLI --claude-zip)
    config_key: null
    description: "Claude ZIP 마이그레이션 (첫 이용 시)"
    class_path: "bulk_import.claude_collector.ClaudeMigrationCollector"
    dependencies:
      migration_parser: "bulk_import.claude_parse.ClaudeMigrationParser"
      markdown_parser: "parse.ai_chat_parse.AIMarkdownParser"
      saver: "storage.ai_chat_saver.AIChatSaver"
    priority: 5                                             # 가장 먼저 실행

# 전역 설정
settings:
  # Collector 실행 순서 정렬 방식
  sort_by_priority: true

  # 에러 발생 시 계속 진행할지 여부
  continue_on_error: true

  # 설정 파일 자동 리로드 (런타임 변경 감지)
  auto_reload: false
